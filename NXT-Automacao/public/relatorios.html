<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001109"><title>Relatórios · Central de Operações de TI</title><style>:root{--navy:#001109;--green:#0aad63;--ink:#172b3f;--muted:#6e8194;--line:#dce5ee;--bg:#f3f6fa;--red:#c33;--amber:#b56a00}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",Tahoma,Arial,sans-serif;font-weight:400;background:radial-gradient(900px 380px at 92% 0,#d9f4e6,transparent 64%),var(--bg);color:var(--ink)}button,input,select{font:inherit}.header{color:#fff;background:linear-gradient(112deg,#001109,#04351c 52%,#087a45)}.bar{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border:1px solid #ffffff45;border-radius:13px;background:#ffffff1c;display:grid;place-items:center}.brand h1{margin:0;font-size:20px}.brand p{margin:4px 0 0;color:#ffffffb5;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:40px;padding:9px 14px;border:1px solid #d4e0e9;border-radius:10px;background:#fff;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}.btn.primary{border-color:#079854;background:linear-gradient(135deg,#12cc78,#079854);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.content{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:22px 0 45px}.panel{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 26px #102a430e;overflow:hidden}.filters{padding:16px;display:grid;grid-template-columns:1.2fr repeat(2,.65fr) 1.5fr auto;gap:10px;align-items:end}.field label{display:block;margin-bottom:6px;color:#405c74;font-size:10px;font-weight:600;text-transform:uppercase}.field input,.field select{width:100%;min-height:42px;padding:8px 11px;border:1px solid #d2dee9;border-radius:10px;background:#fbfdff}.summary{padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:12px 14px;border-bottom:1px solid #e7edf3;text-align:left;vertical-align:top;font-weight:400}th{position:sticky;top:0;background:#f6f9fb;color:#48627a;font-size:10px;font-weight:600;text-transform:uppercase}.empty{padding:50px;text-align:center;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3f6;font-size:10px}.status.ok{background:#e8f9f0;color:#087343}.status.error{background:#fff0ef;color:#b42318}.status.running{background:#fff5dc;color:#8c5a00}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}}@media(max-width:520px){.bar,.content{width:calc(100% - 24px)}.filters{grid-template-columns:1fr}.filters .wide{grid-column:auto}.actions{display:grid;grid-template-columns:1fr 1fr}.brand h1{font-size:17px}th,td{min-width:130px}}@media print{.header,.filters,.no-print{display:none!important}.content{width:100%;padding:0}.panel{border:0;box-shadow:none}th{position:static}}</style><style id="typography-normalization">
html,body{font-family:"Segoe UI",Tahoma,Arial,sans-serif!important;font-weight:400!important;text-shadow:none!important;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body *{text-shadow:none!important}
body :where(p,span,label,input,select,option,textarea,td,li,small,time,caption,legend){font-weight:400!important}
body :where(h1,h2,h3,h4,h5,h6){font-weight:600!important;letter-spacing:-.01em}
body :where(strong,b,th,.eyebrow,.kicker,.badge,.status){font-weight:600!important}
body :where(button,.btn,[role="button"]){font-weight:500!important}
</style><link rel="stylesheet" href="/global-buttons.css"><link rel="stylesheet" href="/global-layout.css"><link rel="icon" href="/assets/nexo-ti-icon.svg" type="image/svg+xml"><link rel="shortcut icon" href="/assets/nexo-ti-icon.svg"></head><body><header class="header"><div class="bar"><div class="brand"><div class="mark">▤</div><div><h1>Centro de relatórios</h1><p>Dados operacionais prontos para análise e compartilhamento</p></div></div><div class="actions"><a class="btn" href="/configuracoes.html">Configurações</a><a class="btn" href="/central.html">Central</a></div></div></header><main class="content"><section class="panel"><div class="filters"><div class="field"><label>Relatório</label><select id="type"><option value="stock">Estoque</option><option value="movements">Movimentações</option><option value="purchases">Compras</option><option value="toners">Toners</option><option value="prints">Impressões</option><option value="maintenance">Manutenções</option><option value="collaborators">Colaboradores</option><option value="audit">Auditoria</option></select></div><div class="field"><label>Data inicial</label><input type="date" id="from"></div><div class="field"><label>Data final</label><input type="date" id="to"></div><div class="field wide"><label>Pesquisar nos resultados</label><input id="query" placeholder="Nome, IP, ativo, categoria..."></div><button class="btn primary" id="generate">Gerar relatório</button></div><div class="summary"><span id="summary">Escolha os filtros e gere o relatório.</span> <span class="actions no-print" style="float:right"><button class="btn" id="excel" disabled>Exportar Excel</button><button class="btn" id="pdf" disabled>Salvar PDF</button></span></div><div class="table-wrap" id="result"><div class="empty">Nenhum relatório gerado.</div></div></section></main><script>
const $=id=>document.getElementById(id);let report=null;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dates(){const d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1);$("from").value=first.toISOString().slice(0,10);$("to").value=d.toISOString().slice(0,10)}dates();
async function generate(){const b=$("generate");b.disabled=true;b.textContent="Gerando…";try{const p=new URLSearchParams({from:$("from").value,to:$("to").value,q:$("query").value});const r=await fetch("/api/reports/"+$("type").value+"?"+p);const d=await r.json();if(!r.ok)throw new Error(d.mensagem);report=d;$("summary").textContent=d.count+" registro(s) · gerado em "+new Date(d.generatedAt).toLocaleString("pt-BR");$("result").innerHTML=d.rows.length?"<table><thead><tr>"+d.columns.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+d.rows.map(row=>"<tr>"+row.map(v=>"<td>"+esc(v)+"</td>").join("")+"</tr>").join("")+"</tbody></table>":'<div class="empty">Nenhum registro encontrado no período.</div>';$("excel").disabled=$("pdf").disabled=false}catch(e){$("result").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}finally{b.disabled=false;b.textContent="Gerar relatório"}}
$("generate").onclick=generate;$("pdf").onclick=()=>window.print();$("excel").onclick=()=>{if(!report)return;const rows=[report.columns,...report.rows],html='<table>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>',blob=new Blob(['\ufeff<html><meta charset="utf-8">'+html+'</html>'],{type:"application/vnd.ms-excel"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="relatorio-"+$("type").value+"-"+new Date().toISOString().slice(0,10)+".xls";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script><script src="/auth-ui.js"></script></body></html>
