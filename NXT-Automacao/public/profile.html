<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha conta · Central de Operações de TI</title>
<style>
:root{--navy:#0b3553;--blue:#1769e0;--text:#172b3f;--muted:#718096;--line:#dce5ee;--bg:#f3f6fa;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 300px at 95% 0,#d9f2f4,transparent 65%),var(--bg)}.header{background:linear-gradient(115deg,#0b3553,#0b6675);color:#fff}.header-inner{max-width:1100px;margin:auto;padding:21px 28px;display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:20px}.brand p{margin:4px 0 0;color:#c8d9e3;font-size:11px}.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font:700 12px inherit;text-decoration:none;cursor:pointer}.btn-primary{border:0;color:#fff;background:linear-gradient(135deg,#1769e0,#087d82)}main{max-width:650px;margin:30px auto;padding:0 20px}.panel{padding:25px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 14px 38px rgba(18,48,72,.08)}h2{margin:0 0 5px;font-size:20px}p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.5}label{display:block;margin:14px 0 7px;color:#40566c;font-size:11px;font-weight:750}input{width:100%;height:46px;padding:0 13px;border:1px solid #cedae7;border-radius:11px;outline:none;font:inherit}input:focus{border-color:#5795e9;box-shadow:0 0 0 4px rgba(23,105,224,.1)}form .btn{width:100%;margin-top:20px}.message{min-height:18px;margin-top:12px;font-size:11px;text-align:center}.success{color:#087d5b}.error{color:#c63e4b}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand"><h1>Minha conta</h1><p>Segurança e acesso ao sistema</p></div><a class="btn" href="/">Voltar ao painel</a></div></header>
<main><section class="panel"><h2>Alterar minha senha</h2><p>Ao salvar, as sessões atuais serão encerradas e você deverá entrar novamente com a nova senha.</p>
<form id="form"><label>Senha atual</label><input id="current" type="password" autocomplete="current-password" required><label>Nova senha</label><input id="next" type="password" autocomplete="new-password" required><label>Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" required><button class="btn btn-primary" id="save" type="submit">Alterar senha</button><div class="message" id="message"></div></form></section></main>
<script>
fetch("/api/auth/me",{cache:"no-store"}).then(function(r){if(!r.ok)location.replace("/login.html")});
document.getElementById("form").addEventListener("submit",async function(event){
 event.preventDefault();const message=document.getElementById("message"),button=document.getElementById("save");message.className="message";message.textContent="";
 if(document.getElementById("next").value!==document.getElementById("confirm").value){message.classList.add("error");message.textContent="A confirmação da senha não confere.";return}
 button.disabled=true;
 try{const response=await fetch("/api/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({currentPassword:document.getElementById("current").value,newPassword:document.getElementById("next").value})});const data=await response.json();if(!response.ok)throw new Error(data.mensagem||"Não foi possível alterar a senha.");message.classList.add("success");message.textContent=data.mensagem;setTimeout(function(){location.replace("/login.html")},1200)}catch(error){message.classList.add("error");message.textContent=error.message;button.disabled=false}
});
</script>
</body></html>
