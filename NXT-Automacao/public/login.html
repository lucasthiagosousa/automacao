<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020908">
  <title>Entrar · Central de Operações de TI</title>
  <style>
    :root{--white:#f8fbfa;--muted:rgba(224,239,235,.58);--line:rgba(255,255,255,.17);--green:#13d58b;--error:#ff8f8f}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}button,input{font:inherit}
    body{overflow:hidden;background:#010706;color:var(--white);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .background,.veil{position:fixed;inset:0;width:100%;height:100%}.background{z-index:0;object-fit:cover;filter:saturate(1.22) contrast(1.12) brightness(.7);transform:scale(1.015)}
    .veil{z-index:1;background:linear-gradient(90deg,rgba(0,4,3,.5),rgba(0,7,5,.12) 52%,rgba(0,6,4,.38)),linear-gradient(0deg,rgba(0,0,0,.42),transparent 62%)}
    .page{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(420px,.8fr);align-items:center;gap:8vw;padding:clamp(48px,7.5vw,108px)}
    .identity{align-self:end;padding-bottom:clamp(80px,18vh,180px);animation:enter .75s ease-out both}
    .identity h1{margin:0;font-size:clamp(76px,10vw,148px);font-weight:660;line-height:.8;letter-spacing:-.075em;text-transform:uppercase}.identity h1 span{display:block}
    .identity p{margin:34px 0 0 4px;color:rgba(255,255,255,.78);font-size:18px;font-weight:550}
    .login-shell{width:min(500px,100%);justify-self:end;animation:enter .75s .08s ease-out both}
    .login-card{min-height:548px;display:flex;flex-direction:column;justify-content:center;padding:54px 42px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(0,35,22,.48),rgba(1,11,9,.77));box-shadow:0 28px 80px rgba(0,0,0,.34);backdrop-filter:blur(18px)}
    .field{display:block;margin-bottom:34px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .input-wrap{display:block;margin-top:14px;border-bottom:1px solid rgba(255,255,255,.22)}
    .input-wrap input{width:100%;height:48px;padding:0;border:0;outline:0;background:transparent;color:#fff;font-size:17px;font-weight:400}.input-wrap input::placeholder{color:rgba(211,229,222,.33)}.input-wrap:focus-within{border-color:rgba(57,229,164,.75)}
    .password-wrap{position:relative}.password-wrap input{padding-right:42px}.password-toggle{position:absolute;right:0;bottom:5px;width:38px;height:38px;border:0;background:transparent;color:rgba(220,239,232,.55);cursor:pointer}.password-toggle:hover{color:#fff}.password-toggle svg{width:19px}
    .submit{width:100%;height:55px;margin-top:18px;border:0;border-radius:28px;background:linear-gradient(180deg,#22dc99,#08b971);color:#00160d;cursor:pointer;font-size:15px;font-weight:700;box-shadow:0 15px 36px rgba(0,210,126,.18);transition:.18s}.submit:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}.submit:disabled{opacity:.62;cursor:wait}
    .message{min-height:20px;margin-top:18px;color:var(--error);font-size:13px;text-align:center}
    @keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @media(max-width:900px){.page{grid-template-columns:1fr;padding:22px}.identity{display:none}.login-shell{justify-self:center}.login-card{min-height:auto}}
    @media(max-width:520px){body{overflow:auto}.login-card{padding:45px 25px;border-radius:24px}.page{padding:15px}}
    @media(prefers-reduced-motion:reduce){.identity,.login-shell{animation:none}.background{transform:none}}
  </style>
</head>

  <div class="veil" aria-hidden="true"></div>
  <main class="page">
    <section class="identity">
      <h1>Controle<span>de TI</span></h1>
      <p>Estoque, toners e colaboradores em um só lugar.</p>
    </section>
    <section class="login-shell" aria-label="Acesso ao sistema">
      <form class="login-card" id="loginForm">
        <label class="field">Usuário<span class="input-wrap"><input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" required autofocus></span></label>
        <label class="field">Senha<span class="input-wrap password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></span></label>
        <button class="submit" id="submitButton" type="submit"><span>Entrar</span></button>
        <div class="message" id="message" role="alert" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script>
    const form=document.getElementById("loginForm"),message=document.getElementById("message"),submitButton=document.getElementById("submitButton"),password=document.getElementById("password"),passwordToggle=document.getElementById("passwordToggle");
    passwordToggle.addEventListener("click",function(){const showing=password.type==="text";password.type=showing?"password":"text";passwordToggle.setAttribute("aria-label",showing?"Mostrar senha":"Ocultar senha");passwordToggle.title=showing?"Mostrar senha":"Ocultar senha"});
    async function checkStatus(){try{const response=await fetch("/api/auth/status",{cache:"no-store"}),data=await response.json();if(data.setupRequired)location.replace("/setup.html");else if(data.authenticated)location.replace("/")}catch{message.textContent="Não foi possível acessar o servidor."}}
    form.addEventListener("submit",async function(event){event.preventDefault();message.textContent="";submitButton.disabled=true;submitButton.querySelector("span").textContent="Entrando...";try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:password.value})}),data=await response.json();if(!response.ok)throw new Error(data.mensagem||"Não foi possível entrar.");location.replace("/")}catch(error){message.textContent=error.message;submitButton.disabled=false;submitButton.querySelector("span").textContent="Entrar"}});
    checkStatus();
  </script>
