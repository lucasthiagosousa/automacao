<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1739">
  <title>Entrar · Controle de Estoque</title>
  <style>
    :root{--navy:#07152d;--navy-2:#0d2448;--blue:#4e8cff;--blue-strong:#246bfd;--green:#38d6a5;--white:#f8fbff;--muted:#9eb0ca;--line:rgba(255,255,255,.14);--red:#ff8a83}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}button,input{font:inherit}
    body{overflow:hidden;color:var(--white);background:var(--navy);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .page{position:relative;isolation:isolate;width:100%;min-height:100vh;display:grid;place-items:center;padding:34px;background:linear-gradient(128deg,#251e34 0%,#17223d 40%,#0a2446 72%,#071b36 100%)}
    .page:before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(ellipse at 8% 0%,rgba(203,103,103,.25),transparent 48%),radial-gradient(ellipse at 92% 100%,rgba(36,107,253,.28),transparent 52%),radial-gradient(circle at 52% 48%,rgba(64,136,255,.1),transparent 34%)}
    .page:after{content:"";position:absolute;z-index:-1;inset:0;opacity:.22;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,transparent,black 30%,black 70%,transparent)}
    .topbar{position:absolute;top:28px;left:34px;right:34px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px rgba(255,255,255,.1)}.brand-mark svg{width:18px;height:18px}.brand-copy strong{display:block;font-size:12px;letter-spacing:-.01em}.brand-copy span{display:block;margin-top:2px;color:#8da1c0;font-size:8px;font-weight:700;letter-spacing:.1em}.availability{display:flex;align-items:center;gap:8px;color:#91a4c0;font-size:9px;font-weight:700}.availability i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(56,214,165,.1),0 0 16px rgba(56,214,165,.38)}
    .login{width:min(350px,100%);animation:arrive .65s cubic-bezier(.2,.8,.2,1) both}.login-header{margin-bottom:25px;text-align:center}.login-icon{width:48px;height:48px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.17);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.055));box-shadow:0 16px 38px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.13);backdrop-filter:blur(14px)}.login-icon svg{width:23px;height:23px;color:#79a8ff}.eyebrow{margin:0 0 8px;color:#73a5ff;font-size:8px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.login h1{margin:0;color:#fff;font-size:27px;font-weight:700;letter-spacing:-.04em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
    .login-form{padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.045));box-shadow:0 28px 70px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.09);backdrop-filter:blur(20px)}
    .field{display:block;margin-bottom:14px;color:#c4d0e1;font-size:9px;font-weight:800;letter-spacing:.025em}.input-wrap{position:relative;display:block;margin-top:7px}.input-wrap>svg{position:absolute;left:13px;top:50%;width:15px;height:15px;color:#7185a4;transform:translateY(-50%);pointer-events:none}.input-wrap input{width:100%;height:43px;padding:0 42px;border:1px solid rgba(255,255,255,.12);border-radius:10px;outline:none;background:rgba(3,13,31,.36);color:#fff;font-size:10px;transition:border-color .18s,box-shadow .18s,background .18s}.input-wrap input::placeholder{color:#6f819d}.input-wrap input:hover{border-color:rgba(255,255,255,.2)}.input-wrap input:focus{border-color:rgba(93,149,255,.76);background:rgba(3,13,31,.5);box-shadow:0 0 0 3px rgba(78,140,255,.11)}
    .password-toggle{position:absolute;right:6px;top:50%;width:31px;height:31px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#7185a4;cursor:pointer;transform:translateY(-50%)}.password-toggle:hover{color:#bed0ec;background:rgba(255,255,255,.06)}.password-toggle svg{width:15px;height:15px}
    .submit{width:100%;height:43px;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(126,172,255,.42);border-radius:10px;background:linear-gradient(135deg,#5a96ff 0%,#286ee8 52%,#2256ba 100%);color:#fff;cursor:pointer;font-size:9px;font-weight:900;letter-spacing:.02em;box-shadow:0 12px 25px rgba(12,69,168,.32),inset 0 1px rgba(255,255,255,.25);transition:transform .18s,filter .18s,box-shadow .18s}.submit:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 15px 30px rgba(12,69,168,.4),inset 0 1px rgba(255,255,255,.25)}.submit:disabled{cursor:wait;opacity:.66}.submit svg{width:14px;height:14px}.message{min-height:15px;margin-top:10px;color:var(--red);font-size:9px;font-weight:700;text-align:center}.secure-note{margin:17px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;color:#7589a7;font-size:8px}.secure-note svg{width:11px;height:11px;color:#58a486}
    .footer{position:absolute;left:30px;right:30px;bottom:23px;display:flex;align-items:center;justify-content:center;color:#607694;font-size:8px;letter-spacing:.025em}
    @keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:600px){body{overflow:auto}.page{min-height:100svh;padding:100px 22px 70px}.topbar{top:22px;left:22px;right:22px}.availability{font-size:0}.brand-copy span{display:none}.login{width:min(370px,100%)}.login-form{padding:20px}.footer{bottom:17px}}
    @media(max-height:650px) and (min-width:601px){.page{padding:82px 30px 55px}.topbar{top:20px}.login-header{margin-bottom:16px}.login-icon{width:40px;height:40px;margin-bottom:11px}.login-form{padding:18px}.secure-note{margin-top:11px}.footer{bottom:14px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"/><path d="M4 12.5 12 17l8-4.5M4 17l8 4 8-4"/></svg></div>
        <div class="brand-copy"><strong>Controle de Estoque</strong><span>OPERAÇÕES DE TI</span></div>
      </div>
      <div class="availability"><i></i>Sistema disponível</div>
    </header>

    <section class="login" aria-labelledby="loginTitle">
      <div class="login-header">
        <div class="login-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <p class="eyebrow">Ambiente protegido</p>
        <h1 id="loginTitle">Acesse o sistema</h1>
        <p class="subtitle">Entre com as credenciais fornecidas pelo Master Admin.</p>
      </div>

      <form class="login-form" id="loginForm">
        <label class="field">Usuário
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" required autofocus>
          </span>
        </label>

        <label class="field">Senha
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
          </span>
        </label>

        <button class="submit" id="submitButton" type="submit"><span>Entrar no sistema</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M14 7l5 5-5 5"/></svg></button>
        <div class="message" id="message" role="alert"></div>
        <p class="secure-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>Sessão segura e acesso controlado por perfil</p>
      </form>
    </section>

    <footer class="footer">Controle de Estoque · Tecnologia da Informação</footer>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const password = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");

    passwordToggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      passwordToggle.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
      passwordToggle.title = showing ? "Mostrar senha" : "Ocultar senha";
    });

    async function checkStatus() {
      try {
        const response = await fetch("/api/auth/status", { cache: "no-store" });
        const data = await response.json();
        if (data.setupRequired) location.replace("/setup.html");
        else if (data.authenticated) location.replace("/");
      } catch {
        message.textContent = "Não foi possível acessar o servidor.";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.querySelector("span").textContent = "Entrando...";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({username: document.getElementById("username").value,password: password.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.mensagem || "Não foi possível entrar.");
        location.replace("/");
      } catch (error) {
        message.textContent = error.message;
        submitButton.disabled = false;
        submitButton.querySelector("span").textContent = "Entrar no sistema";
      }
    });

    checkStatus();
  </script>
</body>
</html>
