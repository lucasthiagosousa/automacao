<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1739">
  <title>Entrar · Controle de Estoque</title>
  <style>
    :root{--blue:#246bfd;--blue-soft:#eef4ff;--ink:#24324a;--muted:#7a8799;--line:#e3e9f1;--canvas:#fff;--red:#c43b35}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}button,input{font:inherit}
    body{overflow:hidden;color:var(--ink);background:var(--canvas);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .page{position:relative;isolation:isolate;width:100%;min-height:100vh;display:grid;place-items:center;padding:34px;background:#fff}
    .page:before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(circle at 10% 4%,rgba(36,107,253,.055),transparent 31%),radial-gradient(circle at 92% 96%,rgba(31,166,137,.04),transparent 30%)}
    .page:after{content:"";position:absolute;z-index:-1;inset:0;opacity:.34;pointer-events:none;background-image:linear-gradient(rgba(22,48,83,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(22,48,83,.018) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,transparent,black 28%,black 72%,transparent)}
    .topbar{position:absolute;top:28px;left:34px;right:34px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#f7f9fc;color:var(--blue)}.brand-mark svg{width:18px;height:18px}.brand-copy strong{display:block;color:#344158;font-size:12px;font-weight:500;letter-spacing:-.01em}.brand-copy span{display:block;margin-top:2px;color:#929dad;font-size:8px;font-weight:500;letter-spacing:.1em}
    .login{width:min(350px,100%);animation:arrive .65s cubic-bezier(.2,.8,.2,1) both}.login-header{margin-bottom:25px;text-align:center}.login-icon{width:48px;height:48px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid #dce6f6;border-radius:15px;background:var(--blue-soft);box-shadow:0 12px 28px rgba(36,107,253,.08)}.login-icon svg{width:23px;height:23px;color:var(--blue)}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}.login h1{margin:0;color:#26354d;font-size:27px;font-weight:500;letter-spacing:-.035em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:10px;font-weight:400;line-height:1.55}
    .login-form{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 20px 55px rgba(33,54,86,.09)}
    .field{display:block;margin-bottom:14px;color:#546176;font-size:9px;font-weight:500;letter-spacing:.02em}.input-wrap{position:relative;display:block;margin-top:7px}.input-wrap>svg{position:absolute;left:13px;top:50%;width:15px;height:15px;color:#8e9aab;transform:translateY(-50%);pointer-events:none}.input-wrap input{width:100%;height:43px;padding:0 42px;border:1px solid #dfe5ed;border-radius:10px;outline:none;background:#fafbfd;color:#25354d;font-size:10px;font-weight:400;transition:border-color .18s,box-shadow .18s,background .18s}.input-wrap input::placeholder{color:#a4adba;font-weight:400}.input-wrap input:hover{border-color:#cbd5e1}.input-wrap input:focus{border-color:#7da7f7;background:#fff;box-shadow:0 0 0 3px rgba(36,107,253,.09)}
    .password-toggle{position:absolute;right:6px;top:50%;width:31px;height:31px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#8e9aab;cursor:pointer;transform:translateY(-50%)}.password-toggle:hover{color:#53647d;background:#f0f3f7}.password-toggle svg{width:15px;height:15px}
    .submit{width:100%;height:43px;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2768db;border-radius:10px;background:linear-gradient(135deg,#4d88f3,#2464d4);color:#fff;cursor:pointer;font-size:9px;font-weight:600;letter-spacing:.015em;box-shadow:0 10px 22px rgba(36,107,253,.2);transition:transform .18s,filter .18s,box-shadow .18s}.submit:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 13px 25px rgba(36,107,253,.25)}.submit:disabled{cursor:wait;opacity:.66}.submit svg{width:14px;height:14px}.message{min-height:15px;margin-top:10px;color:var(--red);font-size:9px;font-weight:500;text-align:center}.secure-note{margin:17px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;color:#8b97a8;font-size:8px;font-weight:400}.secure-note svg{width:11px;height:11px;color:#4aa783}
    .footer{position:absolute;left:30px;right:30px;bottom:23px;display:flex;align-items:center;justify-content:center;color:#a0a9b6;font-size:8px;font-weight:400;letter-spacing:.025em}
    @keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:600px){body{overflow:auto}.page{min-height:100svh;padding:100px 22px 70px}.topbar{top:22px;left:22px;right:22px}.brand-copy span{display:none}.login{width:min(370px,100%)}.login-form{padding:20px}.footer{bottom:17px}}
    @media(max-height:650px) and (min-width:601px){.page{padding:82px 30px 55px}.topbar{top:20px}.login-header{margin-bottom:16px}.login-icon{width:40px;height:40px;margin-bottom:11px}.login-form{padding:18px}.secure-note{margin-top:11px}.footer{bottom:14px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"/><path d="M4 12.5 12 17l8-4.5M4 17l8 4 8-4"/></svg></div>
        <div class="brand-copy"><strong>Controle de Estoque</strong><span>OPERAÇÕES DE TI</span></div>
      </div>
    </header>

    <section class="login" aria-labelledby="loginTitle">
      <div class="login-header">
        <div class="login-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <p class="eyebrow">Ambiente protegido</p>
        <h1 id="loginTitle">Acesse o sistema</h1>
        <p class="subtitle">Entre com as credenciais fornecidas pelo Master Admin.</p>
      </div>

      <form class="login-form" id="loginForm">
        <label class="field">Usuário
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" required autofocus>
          </span>
        </label>

        <label class="field">Senha
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
          </span>
        </label>

        <button class="submit" id="submitButton" type="submit"><span>Entrar no sistema</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M14 7l5 5-5 5"/></svg></button>
        <div class="message" id="message" role="alert"></div>
        <p class="secure-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>Sessão segura e acesso controlado por perfil</p>
      </form>
    </section>

    <footer class="footer">Controle de Estoque · Tecnologia da Informação</footer>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const password = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");

    passwordToggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      passwordToggle.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
      passwordToggle.title = showing ? "Mostrar senha" : "Ocultar senha";
    });

    async function checkStatus() {
      try {
        const response = await fetch("/api/auth/status", { cache: "no-store" });
        const data = await response.json();
        if (data.setupRequired) location.replace("/setup.html");
        else if (data.authenticated) location.replace("/");
      } catch {
        message.textContent = "Não foi possível acessar o servidor.";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.querySelector("span").textContent = "Entrando...";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({username: document.getElementById("username").value,password: password.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.mensagem || "Não foi possível entrar.");
        location.replace("/");
      } catch (error) {
        message.textContent = error.message;
        submitButton.disabled = false;
        submitButton.querySelector("span").textContent = "Entrar no sistema";
      }
    });

    checkStatus();
  </script>
</body>
</html>
