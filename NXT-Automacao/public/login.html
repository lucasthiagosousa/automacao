<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1739">
  <title>Entrar · Controle de Estoque</title>
  <style>
    :root{--blue:#246bfd;--blue-soft:#eef4ff;--ink:#24324a;--muted:#7a8799;--line:#e3e9f1;--canvas:#fff;--red:#c43b35}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}button,input{font:inherit}
    body{overflow:hidden;color:var(--ink);background:var(--canvas);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .page{position:relative;isolation:isolate;width:100%;min-height:100vh;display:grid;place-items:center;padding:34px;background:#fff}
    .page:before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(circle at 10% 4%,rgba(36,107,253,.055),transparent 31%),radial-gradient(circle at 92% 96%,rgba(31,166,137,.04),transparent 30%)}
    .page:after{content:"";position:absolute;z-index:-1;inset:0;opacity:.34;pointer-events:none;background-image:linear-gradient(rgba(22,48,83,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(22,48,83,.018) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,transparent,black 28%,black 72%,transparent)}
    .login{width:min(350px,100%);animation:arrive .65s cubic-bezier(.2,.8,.2,1) both}
    .login-form{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 20px 55px rgba(33,54,86,.09)}
    .field{display:block;margin-bottom:14px;color:#546176;font-size:9px;font-weight:500;letter-spacing:.02em}.input-wrap{position:relative;display:block;margin-top:7px}.input-wrap>svg{position:absolute;left:13px;top:50%;width:15px;height:15px;color:#8e9aab;transform:translateY(-50%);pointer-events:none}.input-wrap input{width:100%;height:43px;padding:0 42px;border:1px solid #dfe5ed;border-radius:10px;outline:none;background:#fafbfd;color:#25354d;font-size:10px;font-weight:400;transition:border-color .18s,box-shadow .18s,background .18s}.input-wrap input::placeholder{color:#a4adba;font-weight:400}.input-wrap input:hover{border-color:#cbd5e1}.input-wrap input:focus{border-color:#7da7f7;background:#fff;box-shadow:0 0 0 3px rgba(36,107,253,.09)}
    .password-toggle{position:absolute;right:6px;top:50%;width:31px;height:31px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#8e9aab;cursor:pointer;transform:translateY(-50%)}.password-toggle:hover{color:#53647d;background:#f0f3f7}.password-toggle svg{width:15px;height:15px}
    .submit{width:100%;height:43px;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2768db;border-radius:10px;background:linear-gradient(135deg,#4d88f3,#2464d4);color:#fff;cursor:pointer;font-size:9px;font-weight:600;letter-spacing:.015em;box-shadow:0 10px 22px rgba(36,107,253,.2);transition:transform .18s,filter .18s,box-shadow .18s}.submit:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 13px 25px rgba(36,107,253,.25)}.submit:disabled{cursor:wait;opacity:.66}.submit svg{width:14px;height:14px}.message{min-height:15px;margin-top:10px;color:var(--red);font-size:9px;font-weight:500;text-align:center}
    @keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:600px){body{overflow:auto}.page{min-height:100svh;padding:40px 22px}.login{width:min(370px,100%)}.login-form{padding:20px}}
    @media(max-height:650px) and (min-width:601px){.page{padding:40px 30px}.login-form{padding:18px}}
  
    body{position:relative;isolation:isolate;background:#061523}
    .login-background{position:fixed;z-index:-4;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.08) brightness(.56);transform:scale(1.015)}
    .login-fallback{position:fixed;z-index:-5;inset:-12%;background:radial-gradient(circle at 74% 20%,#176b82 0,transparent 34%),radial-gradient(circle at 16% 78%,#143b75 0,transparent 32%),linear-gradient(135deg,#061523,#0a3450 52%,#082636);animation:loginDrift 16s ease-in-out infinite alternate}
    .page{background:transparent}
    .page:before{background:linear-gradient(90deg,rgba(2,13,23,.74),rgba(4,20,34,.48)),linear-gradient(0deg,rgba(3,15,26,.7),transparent 55%)}
    .page:after{opacity:.15;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:72px 72px}
    .login-form{border-color:rgba(255,255,255,.58);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);box-shadow:0 28px 85px rgba(0,0,0,.32)}
    @keyframes loginDrift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
    @media(prefers-reduced-motion:reduce){.login-background{display:none}.login-fallback{animation:none}}
</style>
</head>
<body>\n  <div class="login-fallback"></div>\n  <video class="login-background" autoplay muted loop playsinline preload="metadata" aria-hidden="true">\n    <source src="https://videos.pexels.com/video-files/3130284/3130284-hd_1920_1080_30fps.mp4" type="video/mp4">\n  </video>
  <main class="page">
    <section class="login" aria-label="Acesso ao sistema">
      <form class="login-form" id="loginForm">
        <label class="field">Usuário
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" required autofocus>
          </span>
        </label>

        <label class="field">Senha
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
          </span>
        </label>

        <button class="submit" id="submitButton" type="submit"><span>Entrar no sistema</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M14 7l5 5-5 5"/></svg></button>
        <div class="message" id="message" role="alert"></div>
      </form>
    </section>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const password = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");

    passwordToggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      passwordToggle.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
      passwordToggle.title = showing ? "Mostrar senha" : "Ocultar senha";
    });

    async function checkStatus() {
      try {
        const response = await fetch("/api/auth/status", { cache: "no-store" });
        const data = await response.json();
        if (data.setupRequired) location.replace("/setup.html");
        else if (data.authenticated) location.replace("/");
      } catch {
        message.textContent = "Não foi possível acessar o servidor.";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.querySelector("span").textContent = "Entrando...";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({username: document.getElementById("username").value,password: password.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.mensagem || "Não foi possível entrar.");
        location.replace("/");
      } catch (error) {
        message.textContent = error.message;
        submitButton.disabled = false;
        submitButton.querySelector("span").textContent = "Entrar no sistema";
      }
    });

    checkStatus();
  </script>
</body>
</html>
