<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001109"><title>Automações · Central de Operações de TI</title><style>:root{--navy:#001109;--green:#0aad63;--ink:#172b3f;--muted:#6e8194;--line:#dce5ee;--bg:#f3f6fa;--red:#c33;--amber:#b56a00}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",Tahoma,Arial,sans-serif;font-weight:400;background:radial-gradient(900px 380px at 92% 0,#d9f4e6,transparent 64%),var(--bg);color:var(--ink)}button,input,select{font:inherit}.header{color:#fff;background:linear-gradient(112deg,#001109,#04351c 52%,#087a45)}.bar{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border:1px solid #ffffff45;border-radius:13px;background:#ffffff1c;display:grid;place-items:center}.brand h1{margin:0;font-size:20px}.brand p{margin:4px 0 0;color:#ffffffb5;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:40px;padding:9px 14px;border:1px solid #d4e0e9;border-radius:10px;background:#fff;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}.btn.primary{border-color:#079854;background:linear-gradient(135deg,#12cc78,#079854);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.content{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:22px 0 45px}.panel{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 26px #102a430e;overflow:hidden}.filters{padding:16px;display:grid;grid-template-columns:1.2fr repeat(2,.65fr) 1.5fr auto;gap:10px;align-items:end}.field label{display:block;margin-bottom:6px;color:#405c74;font-size:10px;font-weight:600;text-transform:uppercase}.field input,.field select{width:100%;min-height:42px;padding:8px 11px;border:1px solid #d2dee9;border-radius:10px;background:#fbfdff}.summary{padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:12px 14px;border-bottom:1px solid #e7edf3;text-align:left;vertical-align:top;font-weight:400}th{position:sticky;top:0;background:#f6f9fb;color:#48627a;font-size:10px;font-weight:600;text-transform:uppercase}.empty{padding:50px;text-align:center;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3f6;font-size:10px}.status.ok{background:#e8f9f0;color:#087343}.status.error{background:#fff0ef;color:#b42318}.status.running{background:#fff5dc;color:#8c5a00}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}}@media(max-width:520px){.bar,.content{width:calc(100% - 24px)}.filters{grid-template-columns:1fr}.filters .wide{grid-column:auto}.actions{display:grid;grid-template-columns:1fr 1fr}.brand h1{font-size:17px}th,td{min-width:130px}}@media print{.header,.filters,.no-print{display:none!important}.content{width:100%;padding:0}.panel{border:0;box-shadow:none}th{position:static}}.cards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:16px}.card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff}.card h3{margin:0 0 5px;font-size:13px}.card p{min-height:32px;margin:0 0 12px;color:var(--muted);font-size:11px}.card .btn{width:100%}.panel-head{padding:16px}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style><style id="typography-normalization">
html,body{font-family:"Segoe UI",Tahoma,Arial,sans-serif!important;font-weight:400!important;text-shadow:none!important;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body *{text-shadow:none!important}
body :where(p,span,label,input,select,option,textarea,td,li,small,time,caption,legend){font-weight:400!important}
body :where(h1,h2,h3,h4,h5,h6){font-weight:600!important;letter-spacing:-.01em}
body :where(strong,b,th,.eyebrow,.kicker,.badge,.status){font-weight:600!important}
body :where(button,.btn,[role="button"]){font-weight:500!important}
</style><style id="daily-report-controls-styles">
.report-card{grid-column:span 2}.report-enabled{min-height:40px;margin-bottom:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#f8fbfc;display:flex;align-items:center;gap:9px;color:#405c74;font-size:12px}.report-enabled input{width:17px;height:17px;accent-color:var(--green)}.report-schedules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.schedule-box{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fbfdff}.schedule-box strong{display:block;margin-bottom:3px;font-size:13px}.schedule-box span{display:block;min-height:30px;color:var(--muted);font-size:11px;line-height:1.35}.schedule-box input{width:100%;height:40px;margin:8px 0;padding:0 10px;border:1px solid #d4e0e9;border-radius:9px;background:#fff;color:var(--ink)}.schedule-box .btn{width:100%}.save-schedule{width:100%;margin-bottom:8px}.report-card>small{display:block;min-height:17px;margin-top:7px;color:var(--muted);font-size:11px;line-height:1.35}
@media(max-width:1000px){.report-card{grid-column:span 2}}@media(max-width:620px){.report-card{grid-column:auto}.report-schedules{grid-template-columns:1fr}}
</style><style id="history-navigation-styles">
.history-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:#fbfdff}.history-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}.history-tab{flex:0 0 auto;min-height:34px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#405c74;font-size:12px;cursor:pointer}.history-tab.active{border-color:#079854;background:#e9f8f0;color:#087343;font-weight:600}.history-count{flex:0 0 auto;color:var(--muted);font-size:12px}.history-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}.history-pages{display:flex;align-items:center;gap:5px}.page-btn{min-width:36px;min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}.page-btn.active{border-color:#079854;background:#0aad63;color:#fff}.page-btn:disabled{opacity:.45;cursor:not-allowed}.page-info{color:var(--muted);font-size:12px}.history-table{max-height:520px;overflow:auto}.history-table th{z-index:1}
@media(max-width:720px){.history-toolbar{align-items:flex-start;flex-direction:column}.history-tabs{width:100%}.history-count{padding-left:2px}.history-footer{align-items:stretch;flex-direction:column}.history-pages{justify-content:space-between}.page-info{text-align:center}.history-table{max-height:460px}}
</style><style id="destination-navigation-styles">
.destination-section{scroll-margin-top:18px}.destination-section.destination-highlight{animation:destinationPulse 1.15s ease-out}.destination-section:focus{outline:none}@keyframes destinationPulse{0%{box-shadow:0 0 0 4px #0aad6330,0 8px 26px #102a430e}100%{box-shadow:0 8px 26px #102a430e}}
@media(prefers-reduced-motion:reduce){.destination-section.destination-highlight{animation:none}}
</style><link rel="stylesheet" href="/global-buttons.css"><link rel="stylesheet" href="/global-layout.css"><link rel="icon" href="/assets/nexo-ti-icon.svg" type="image/svg+xml"><link rel="shortcut icon" href="/assets/nexo-ti-icon.svg"></head><body><header class="header"><div class="bar"><div class="brand"><div class="mark">↻</div><div><h1>Monitoramento da automação</h1><p>Execuções, duração, resultados e nova tentativa em um só lugar</p></div></div><div class="actions"><a class="btn" href="/configuracoes.html">Configurações</a><a class="btn" href="/central.html">Central</a></div></div></header><main class="content"><section class="cards" id="cards"></section><section class="panel destination-section" id="history-navigation" tabindex="-1"><div class="panel-head"><h2>Atividades registradas</h2><p>Histórico das execuções automáticas e manuais, organizado por tipo e página.</p></div><div class="history-toolbar"><div class="history-tabs" id="historyTabs" aria-label="Filtrar atividades"></div><div class="history-count" id="historyCount">Carregando…</div></div><div id="history"><div class="empty">Carregando execuções…</div></div><div class="history-footer" id="historyFooter" hidden></div></section></main><script>
const types={nxt:["Atualização do NXT","Sincroniza o estoque com o NXT4Insight."],snmp:["Leitura SNMP","Atualiza impressoras, toners e contadores."],teams:["Envio ao Teams","Envia agora os resumos operacionais."],activity_start:["Início do dia","Resumo operacional de abertura."],closing:["Relatórios do dia","Configure a abertura e o fechamento nos dias úteis."],backup:["Backup verificado","Cria e verifica uma cópia do banco."]};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("cards").innerHTML=Object.entries(types).map(([k,v])=>{
 if(k==="activity_start")return "";
 if(k==="closing")return '<article class="card report-card destination-section" id="daily-report-controls" tabindex="-1"><h3>'+v[0]+'</h3><p>'+v[1]+'</p><label class="report-enabled"><input id="dailyEnabled" type="checkbox"> Enviar automaticamente de segunda a sexta-feira</label><div class="report-schedules"><section class="schedule-box"><strong>Início do dia</strong><span>Resumo da situação encontrada no começo das atividades.</span><input id="startTime" type="time" value="07:00" aria-label="Horário de início do dia"><button class="btn" id="sendStart" type="button">Enviar início agora</button></section><section class="schedule-box"><strong>Fechamento do dia</strong><span>Movimentações, saídas, entradas e situação ao encerrar o dia.</span><input id="closingTime" type="time" value="17:00" aria-label="Horário de fechamento do dia"><button class="btn" id="sendClosing" type="button">Enviar fechamento agora</button></section></div><button class="btn primary save-schedule" id="saveDaily" type="button">Salvar os dois horários</button><small id="dailyMessage"></small></article>';
 return '<article class="card"><h3>'+v[0]+'</h3><p>'+v[1]+'</p><button class="btn primary" data-run="'+k+'">Executar agora</button></article>'
}).join("");
async function loadDailySettings(){try{const r=await fetch("/api/system/daily-report-settings",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyEnabled").checked=d.enabled;document.getElementById("startTime").value=d.startTime||"07:00";document.getElementById("closingTime").value=d.closingTime||"17:00";const sent=[];if(d.lastStartSent)sent.push("início: "+d.lastStartSent);if(d.lastClosingSent)sent.push("fechamento: "+d.lastClosingSent);document.getElementById("dailyMessage").textContent=sent.length?"Últimos envios — "+sent.join(" · "):"Nenhum envio automático registrado."}catch(e){document.getElementById("dailyMessage").textContent=e.message}}
async function saveDailySettings(){const b=document.getElementById("saveDaily");b.disabled=true;try{const body={enabled:document.getElementById("dailyEnabled").checked,startTime:document.getElementById("startTime").value,closingTime:document.getElementById("closingTime").value};const r=await fetch("/api/system/daily-report-settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyMessage").textContent="Agendamento salvo: início às "+d.startTime+" e fechamento às "+d.closingTime+"."}catch(e){document.getElementById("dailyMessage").textContent=e.message}finally{b.disabled=false}}
async function sendDailyNow(mode){const b=document.getElementById(mode==="start"?"sendStart":"sendClosing"),old=b.textContent;b.disabled=true;b.textContent="Preparando…";try{const r=await fetch("/api/system/daily-report/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:mode})}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyMessage").textContent=d.mensagem;await load()}catch(e){document.getElementById("dailyMessage").textContent=e.message}finally{b.disabled=false;b.textContent=old}}
function navigateToDestination(){const id=location.hash.slice(1);if(!id)return;const target=document.getElementById(id);if(!target)return;requestAnimationFrame(()=>{target.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});target.focus({preventScroll:true});target.classList.remove("destination-highlight");requestAnimationFrame(()=>target.classList.add("destination-highlight"));setTimeout(()=>target.classList.remove("destination-highlight"),1200)})}
window.addEventListener("hashchange",navigateToDestination);
document.getElementById("saveDaily").onclick=saveDailySettings;document.getElementById("sendStart").onclick=function(){sendDailyNow("start")};document.getElementById("sendClosing").onclick=function(){sendDailyNow("closing")};
const historyFilters=[["all","Todas"],["nxt","NXT"],["snmp","Impressoras"],["teams","Teams"],["reports","Relatórios"],["backup","Backups"]];let historyItems=[],historyFilter="all",historyPage=1;const historyPageSize=6;
function matchesHistoryFilter(item){if(historyFilter==="all")return true;if(historyFilter==="reports")return item.automationType==="closing"||item.automationType==="activity_start";return item.automationType===historyFilter}
function renderHistoryTabs(){document.getElementById("historyTabs").innerHTML=historyFilters.map(x=>'<button class="history-tab '+(historyFilter===x[0]?"active":"")+'" type="button" data-history-filter="'+x[0]+'">'+x[1]+'</button>').join("")}
function renderHistory(){renderHistoryTabs();const filtered=historyItems.filter(matchesHistoryFilter),pages=Math.max(1,Math.ceil(filtered.length/historyPageSize));historyPage=Math.min(historyPage,pages);const start=(historyPage-1)*historyPageSize,visible=filtered.slice(start,start+historyPageSize),history=document.getElementById("history"),footer=document.getElementById("historyFooter");document.getElementById("historyCount").textContent=filtered.length+" atividade(s)";history.innerHTML=visible.length?'<div class="table-wrap history-table"><table><thead><tr><th>Início</th><th>Automação</th><th>Origem</th><th>Resultado</th><th>Duração</th><th>Mensagem</th><th></th></tr></thead><tbody>'+visible.map(x=>'<tr><td>'+esc(new Date(x.startedAt).toLocaleString("pt-BR"))+'</td><td>'+esc(types[x.automationType]?.[0]||x.automationType)+'</td><td>'+esc(x.triggerType)+'</td><td><span class="status '+esc(x.status)+'">'+esc(x.status)+'</span></td><td>'+esc(x.durationMs==null?"—":(x.durationMs/1000).toFixed(1)+" s")+'</td><td>'+esc(x.message||x.error||"—")+'</td><td><button class="btn" data-run="'+esc(x.automationType)+'">Executar novamente</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Nenhuma atividade encontrada nesta guia.</div>';footer.hidden=false;let buttons="";const windowSize=5;let first=Math.max(1,historyPage-Math.floor(windowSize/2)),last=Math.min(pages,first+windowSize-1);first=Math.max(1,last-windowSize+1);for(let page=first;page<=last;page++)buttons+='<button class="page-btn '+(page===historyPage?"active":"")+'" type="button" data-history-page="'+page+'" aria-label="Página '+page+'">'+page+'</button>';footer.innerHTML='<span class="page-info">Exibindo '+(filtered.length?start+1:0)+'–'+Math.min(start+historyPageSize,filtered.length)+' de '+filtered.length+' · Página '+historyPage+' de '+pages+'</span><div class="history-pages"><button class="page-btn" type="button" data-history-page="'+(historyPage-1)+'" '+(historyPage===1?"disabled":"")+'>Anterior</button>'+buttons+'<button class="page-btn" type="button" data-history-page="'+(historyPage+1)+'" '+(historyPage===pages?"disabled":"")+'>Próxima</button></div>'}
async function load(){try{const r=await fetch("/api/system/automations"),d=await r.json();if(!r.ok)throw new Error(d.mensagem);historyItems=d.items||[];renderHistory()}catch(e){document.getElementById("history").innerHTML='<div class="empty">'+esc(e.message)+'</div>';document.getElementById("historyCount").textContent="Falha ao carregar"}}
document.addEventListener("click",async e=>{const filter=e.target.closest("[data-history-filter]");if(filter){historyFilter=filter.dataset.historyFilter;historyPage=1;renderHistory();return}const page=e.target.closest("[data-history-page]");if(page&&!page.disabled){historyPage=Number(page.dataset.historyPage)||1;renderHistory();document.getElementById("history").scrollIntoView({behavior:"smooth",block:"nearest"});return}const b=e.target.closest("[data-run]");if(!b)return;b.disabled=true;const old=b.textContent;b.textContent="Executando…";try{const r=await fetch("/api/system/automations/"+b.dataset.run+"/run",{method:"POST",headers:{"Content-Type":"application/json"}}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);await load()}catch(err){alert(err.message)}finally{b.disabled=false;b.textContent=old}});loadDailySettings();load();navigateToDestination();setInterval(load,15000);
</script><script src="/auth-ui.js"></script></body></html>
