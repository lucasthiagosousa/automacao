<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001109"><title>Automações · Central de Operações de TI</title><style>:root{--navy:#001109;--green:#0aad63;--ink:#172b3f;--muted:#6e8194;--line:#dce5ee;--bg:#f3f6fa;--red:#c33;--amber:#b56a00}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",Tahoma,Arial,sans-serif;font-weight:400;background:radial-gradient(900px 380px at 92% 0,#d9f4e6,transparent 64%),var(--bg);color:var(--ink)}button,input,select{font:inherit}.header{color:#fff;background:linear-gradient(112deg,#001109,#04351c 52%,#087a45)}.bar{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border:1px solid #ffffff45;border-radius:13px;background:#ffffff1c;display:grid;place-items:center}.brand h1{margin:0;font-size:20px}.brand p{margin:4px 0 0;color:#ffffffb5;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:40px;padding:9px 14px;border:1px solid #d4e0e9;border-radius:10px;background:#fff;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}.btn.primary{border-color:#079854;background:linear-gradient(135deg,#12cc78,#079854);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.content{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:22px 0 45px}.panel{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 26px #102a430e;overflow:hidden}.filters{padding:16px;display:grid;grid-template-columns:1.2fr repeat(2,.65fr) 1.5fr auto;gap:10px;align-items:end}.field label{display:block;margin-bottom:6px;color:#405c74;font-size:10px;font-weight:600;text-transform:uppercase}.field input,.field select{width:100%;min-height:42px;padding:8px 11px;border:1px solid #d2dee9;border-radius:10px;background:#fbfdff}.summary{padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:12px 14px;border-bottom:1px solid #e7edf3;text-align:left;vertical-align:top;font-weight:400}th{position:sticky;top:0;background:#f6f9fb;color:#48627a;font-size:10px;font-weight:600;text-transform:uppercase}.empty{padding:50px;text-align:center;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3f6;font-size:10px}.status.ok{background:#e8f9f0;color:#087343}.status.error{background:#fff0ef;color:#b42318}.status.running{background:#fff5dc;color:#8c5a00}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}}@media(max-width:520px){.bar,.content{width:calc(100% - 24px)}.filters{grid-template-columns:1fr}.filters .wide{grid-column:auto}.actions{display:grid;grid-template-columns:1fr 1fr}.brand h1{font-size:17px}th,td{min-width:130px}}@media print{.header,.filters,.no-print{display:none!important}.content{width:100%;padding:0}.panel{border:0;box-shadow:none}th{position:static}}.cards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:16px}.card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff}.card h3{margin:0 0 5px;font-size:13px}.card p{min-height:32px;margin:0 0 12px;color:var(--muted);font-size:11px}.card .btn{width:100%}.panel-head{padding:16px}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style><style id="typography-normalization">
html,body{font-family:"Segoe UI",Tahoma,Arial,sans-serif!important;font-weight:400!important;text-shadow:none!important;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body *{text-shadow:none!important}
body :where(p,span,label,input,select,option,textarea,td,li,small,time,caption,legend){font-weight:400!important}
body :where(h1,h2,h3,h4,h5,h6){font-weight:600!important;letter-spacing:-.01em}
body :where(strong,b,th,.eyebrow,.kicker,.badge,.status){font-weight:600!important}
body :where(button,.btn,[role="button"]){font-weight:500!important}
</style><style id="daily-report-controls">
.report-card{grid-column:span 2}.report-enabled{min-height:38px;margin-bottom:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#f8fbfc;display:flex;align-items:center;gap:8px;color:#405c74;font-size:11px}.report-enabled input{width:16px;height:16px;accent-color:var(--green)}.schedule-controls{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:8px}.schedule-controls label{color:#51697c;font-size:10px}.schedule-controls input{width:100%;height:40px;margin-top:4px;padding:0 9px;border:1px solid #d4e0e9;border-radius:9px;background:#fff;color:var(--ink)}.report-card>small{display:block;min-height:17px;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.35}
@media(max-width:1000px){.report-card{grid-column:span 2}}@media(max-width:520px){.report-card{grid-column:auto}.schedule-controls{grid-template-columns-columns:1fr}.schedule-controls{grid-template-columns:1fr}.schedule-controls .btn{width:100%}}
</style></head><body><header class="header"><div class="bar"><div class="brand"><div class="mark">↻</div><div><h1>Monitoramento da automação</h1><p>Execuções, duração, resultados e nova tentativa em um só lugar</p></div></div><div class="actions"><a class="btn" href="/configuracoes.html">Configurações</a><a class="btn" href="/central.html">Central</a></div></div></header><main class="content"><section class="cards" id="cards"></section><section class="panel"><div class="panel-head"><h2>Histórico de execuções</h2><p>As últimas 200 operações automáticas ou manuais.</p></div><div class="table-wrap" id="history"><div class="empty">Carregando execuções…</div></div></section></main><script>
const types={nxt:["Atualização do NXT","Sincroniza o estoque com o NXT4Insight."],snmp:["Leitura SNMP","Atualiza impressoras, toners e contadores."],teams:["Envio ao Teams","Envia agora os resumos operacionais."],closing:["Relatório diário","Envie agora ou escolha o horário automático nos dias úteis."],backup:["Backup verificado","Cria e verifica uma cópia do banco."]};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("cards").innerHTML=Object.entries(types).map(([k,v])=>{
 if(k==="closing")return '<article class="card report-card"><h3>'+v[0]+'</h3><p>'+v[1]+'</p><label class="report-enabled"><input id="dailyEnabled" type="checkbox"> Envio automático ativo</label><div class="schedule-controls"><label>Horário<input id="dailyTime" type="time" value="17:00"></label><button class="btn" id="saveDaily" type="button">Salvar horário</button></div><button class="btn primary" id="sendDaily" type="button">Enviar relatório agora</button><small id="dailyMessage"></small></article>';
 return '<article class="card"><h3>'+v[0]+'</h3><p>'+v[1]+'</p><button class="btn primary" data-run="'+k+'">Executar agora</button></article>'
}).join("");
async function loadDailySettings(){try{const r=await fetch("/api/system/daily-report-settings",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyEnabled").checked=d.enabled;document.getElementById("dailyTime").value=d.time||"17:00";document.getElementById("dailyMessage").textContent=d.lastSent?"Último envio automático: "+d.lastSent:"Nenhum envio automático registrado."}catch(e){document.getElementById("dailyMessage").textContent=e.message}}
async function saveDailySettings(){const b=document.getElementById("saveDaily");b.disabled=true;try{const r=await fetch("/api/system/daily-report-settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:document.getElementById("dailyEnabled").checked,time:document.getElementById("dailyTime").value})}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyMessage").textContent="Agendamento salvo para "+d.time+" nos dias úteis."}catch(e){document.getElementById("dailyMessage").textContent=e.message}finally{b.disabled=false}}
async function sendDailyNow(){const b=document.getElementById("sendDaily"),old=b.textContent;b.disabled=true;b.textContent="Preparando relatório…";try{const r=await fetch("/api/system/daily-report/send",{method:"POST"}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("dailyMessage").textContent=d.mensagem;await load()}catch(e){document.getElementById("dailyMessage").textContent=e.message}finally{b.disabled=false;b.textContent=old}}
document.getElementById("saveDaily").onclick=saveDailySettings;document.getElementById("sendDaily").onclick=sendDailyNow;
async function load(){try{const r=await fetch("/api/system/automations"),d=await r.json();if(!r.ok)throw new Error(d.mensagem);document.getElementById("history").innerHTML=d.items.length?'<table><thead><tr><th>Início</th><th>Automação</th><th>Origem</th><th>Resultado</th><th>Duração</th><th>Mensagem</th><th></th></tr></thead><tbody>'+d.items.map(x=>'<tr><td>'+esc(new Date(x.startedAt).toLocaleString("pt-BR"))+'</td><td>'+esc(types[x.automationType]?.[0]||x.automationType)+'</td><td>'+esc(x.triggerType)+'</td><td><span class="status '+esc(x.status)+'">'+esc(x.status)+'</span></td><td>'+esc(x.durationMs==null?"—":(x.durationMs/1000).toFixed(1)+" s")+'</td><td>'+esc(x.message||x.error||"—")+'</td><td><button class="btn" data-run="'+esc(x.automationType)+'">Executar novamente</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">Nenhuma execução registrada ainda.</div>'}catch(e){document.getElementById("history").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-run]");if(!b)return;b.disabled=true;const old=b.textContent;b.textContent="Executando…";try{const r=await fetch("/api/system/automations/"+b.dataset.run+"/run",{method:"POST",headers:{"Content-Type":"application/json"}}),d=await r.json();if(!r.ok)throw new Error(d.mensagem);await load()}catch(err){alert(err.message)}finally{b.disabled=false;b.textContent=old}});loadDailySettings();load();setInterval(load,15000);
</script><script src="/auth-ui.js"></script></body></html>
