<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar NXT</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#10233f;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 85% 5%,#dff8f7 0,transparent 38%),#f5f8fc}main{width:min(100%,430px);padding:34px;border:1px solid #dbe5ef;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(16,35,63,.12)}.icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#176ee8,#0f919b);box-shadow:0 12px 28px rgba(23,110,232,.24);font-size:24px}h1{margin:24px 0 8px;font-size:26px;letter-spacing:-.03em}p{margin:0 0 26px;color:#667892;font-size:14px;line-height:1.55}label{display:block;margin:15px 0 7px;color:#344967;font-size:12px;font-weight:700}input{width:100%;height:48px;padding:0 14px;border:1px solid #cfdbea;border-radius:13px;outline:none;font:inherit;background:#fbfdff}input:focus{border-color:#2a78e7;box-shadow:0 0 0 4px rgba(42,120,231,.11)}button{width:100%;height:48px;margin-top:20px;border:0;border-radius:13px;color:#fff;background:linear-gradient(135deg,#176ee8,#0f728f);font:700 14px inherit;cursor:pointer}button.secondary{margin-top:9px;color:#5e7088;background:transparent}.message{min-height:20px;margin-top:12px;color:#c93c4a;font-size:12px;text-align:center}small{display:block;margin-top:18px;color:#8b9ab0;font-size:11px;line-height:1.5;text-align:center}
</style></head><body><main><div class="icon">◆</div><h1>Conectar ao NXT4Insight</h1><p>Configure as credenciais usadas somente pela atualização automática. Elas ficam armazenadas localmente neste computador.</p><form id="form"><label for="email">Usuário ou e-mail NXT</label><input id="email" autocomplete="username" required><label for="password">Senha NXT</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Salvar e abrir o sistema</button><button class="secondary" id="skip" type="button">Configurar mais tarde</button><div class="message" id="message"></div></form><small>O banco, as planilhas e os relatórios serão preservados na pasta de dados do aplicativo.</small></main>
<script>const form=document.getElementById("form"),message=document.getElementById("message");window.nxtDesktop.obterConfiguracao().then(({email})=>document.getElementById("email").value=email||"");form.addEventListener("submit",async(e)=>{e.preventDefault();message.textContent="";try{await window.nxtDesktop.salvarConfiguracao({email:document.getElementById("email").value,password:document.getElementById("password").value})}catch(erro){message.textContent=erro.message}});document.getElementById("skip").addEventListener("click",()=>window.nxtDesktop.pularConfiguracao());</script></body></html>
