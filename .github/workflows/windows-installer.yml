name: Gerar instalador Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NXT-Automacao
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: NXT-Automacao/package-lock.json
      - name: Instalar dependências do sistema
        run: npm ci
      - name: Instalar empacotador desktop
        run: npm install --no-save --package-lock=false electron@39.2.7 electron-builder@26.0.12
      - name: Preparar serviço Windows
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "build\CentralOperacoesTI-Service.exe"
          if (-not (Test-Path "build\CentralOperacoesTI-Service.exe")) {
            throw "Executável do serviço Windows não foi baixado."
          }
          if (-not (Test-Path "build\CentralOperacoesTI-Service.xml")) {
            throw "Configuração do serviço Windows não encontrada."
          }
      - name: Validar banco local e permissões
        shell: powershell
        run: node smoke-test.js
      - name: Validar sintaxe e vídeo do login
        shell: powershell
        run: |
          node --check server.js
          node --check service.js
          node --check desktop.js
          if (-not (Test-Path "build\CentralOperacoesTI-Service.exe")) {
            throw "Executável do serviço Windows não encontrado."
          }
          if (-not (Test-Path "build\CentralOperacoesTI-Service.xml")) {
            throw "Configuração do serviço Windows não encontrada."
          }
          if (-not (Test-Path "public\\assets\\login-background.mp4")) {
            throw "Video do login nao encontrado."
          }

      - name: Gerar Setup.exe
        run: npx electron-builder --config electron-builder.yml --win nsis
      - name: Testar instalação e serviço 24x7
        shell: powershell
        run: |
          $arquivo = Get-ChildItem "dist\*Setup*.exe" | Select-Object -First 1
          if (-not $arquivo) { throw "Instalador não encontrado para teste." }

          $processo = Start-Process -FilePath $arquivo.FullName -ArgumentList "/S" -Wait -PassThru
          if ($processo.ExitCode -ne 0) {
            throw "Instalador retornou código $($processo.ExitCode)."
          }

          $servico = Get-Service -Name "CentralOperacoesTI" -ErrorAction Stop
          if ($servico.Status -ne "Running") {
            Start-Service -Name "CentralOperacoesTI"
          }

          $inicioAutomatico = (Get-CimInstance Win32_Service -Filter "Name='CentralOperacoesTI'").StartMode
          if ($inicioAutomatico -ne "Auto") {
            throw "Serviço não está configurado para início automático: $inicioAutomatico"
          }

          $respondendo = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:3000/api/health" -TimeoutSec 3
              if ($health.sucesso -eq $true) {
                $respondendo = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
          }

          if (-not $respondendo) {
            Get-ChildItem "$env:ProgramData\NexoTI\CentralOperacoes\logs" -ErrorAction SilentlyContinue
            Get-Content "$env:ProgramData\NexoTI\CentralOperacoes\logs\*.out.log" -Tail 120 -ErrorAction SilentlyContinue
            Get-Content "$env:ProgramData\NexoTI\CentralOperacoes\logs\*.err.log" -Tail 120 -ErrorAction SilentlyContinue
            throw "Serviço instalado, mas o painel não respondeu na porta 3000."
          }

          Write-Host "Serviço CentralOperacoesTI instalado, automático e respondendo na porta 3000."
      - name: Validar dependências empacotadas
        shell: powershell
        run: |
          $app = "dist\win-unpacked\resources\app"
          $arquivos = @(
            "$app\node_modules\dunder-proto\get.js",
            "$app\node_modules\get-proto\index.js",
            "$app\node_modules\express\index.js",
            "$app\server.js",
            "$app\service.js",
            "$app\desktop.js",
            "dist\win-unpacked\CentralOperacoesTI-Service.exe",
            "dist\win-unpacked\CentralOperacoesTI-Service.xml"
          )
          foreach ($arquivo in $arquivos) {
            if (-not (Test-Path $arquivo)) { throw "Arquivo obrigatório ausente: $arquivo" }
          }

      - name: Publicar versão permanente
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arquivo = Get-ChildItem "dist\*Setup*.exe" | Select-Object -First 1
          if (-not $arquivo) { throw "Instalador não encontrado." }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-service"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "Central de Operações de TI — Serviço $version" --notes "Instalador Windows com backend 24/7 como serviço automático, recuperação em caso de falha, acesso pela rede na porta 3000 e dados persistentes em ProgramData."
          }
          gh release upload $tag $arquivo.FullName --clobber

      - name: Publicar instalador temporário
        uses: actions/upload-artifact@v4
        with:
          name: Central-Operacoes-TI-Windows
          path: NXT-Automacao/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
