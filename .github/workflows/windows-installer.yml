name: Gerar instalador Windows Server

on:
  workflow_dispatch:
  push:
    branches: [main, ferias-acessos-local, fix/nexo-central-server-installer]
    paths:
      - "NXT-Automacao/**"
      - ".github/workflows/windows-installer.yml"

concurrency:
  group: windows-server-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-server:
    name: Montar instalador do servidor
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: NXT-Automacao

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: NXT-Automacao/package-lock.json

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Validar aplicação
        shell: pwsh
        run: |
          node --check server.js
          node --check auth.js
          node --check toner-monitor.js
          npm test

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "nexo-ti-server"
          $browsers = Join-Path $stage "browsers"
          $app = Join-Path $stage "app"
          $runtime = Join-Path $stage "runtime"
          $service = Join-Path $stage "service"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $app, $runtime, $service, $browsers -ItemType Directory -Force | Out-Null

          $robocopyArgs = @(".", $app, "/E", "/R:2", "/W:2", "/XD", (Join-Path $PWD "dist"), (Join-Path $PWD "dados"), (Join-Path $PWD "build"), (Join-Path $PWD "server-installer"), "/XF", ".env")
          & robocopy @robocopyArgs
          if ($LASTEXITCODE -gt 7) {
            throw "Falha ao copiar a aplicação. Robocopy: $LASTEXITCODE"
          }

          Copy-Item (Get-Command node).Source (Join-Path $runtime "node.exe") -Force

          $env:PLAYWRIGHT_BROWSERS_PATH = $browsers
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao instalar o Chromium da automação."
          }

          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile (Join-Path $service "NexoTICentral.exe")

          Copy-Item "server-installer\NexoTICentral.xml" $service -Force
          Copy-Item "server-installer\Configure-Server.ps1" $service -Force
          Copy-Item "server-installer\Remove-LegacyPanel.ps1" $service -Force
          Copy-Item "server-installer\Bandeja-Central.ps1" $service -Force

          if (-not (Test-Path (Join-Path $app "server.js"))) { throw "server.js ausente no pacote." }
          if (-not (Test-Path (Join-Path $app "public\login.html"))) { throw "interface web ausente no pacote." }
          if (-not (Test-Path (Join-Path $app "node_modules\express"))) { throw "dependências ausentes no pacote." }
          if (-not (Test-Path (Join-Path $app "node_modules\type-is\node_modules\content-type\dist\index.js"))) { throw "content-type/dist ausente no pacote." }
          if (-not (Test-Path (Join-Path $runtime "node.exe"))) { throw "Node.js ausente no pacote." }
          if (-not (Get-ChildItem $browsers -Directory | Where-Object Name -Match "chromium")) {
            throw "Chromium ausente no pacote."
          }

          "NXT_STAGE_DIR=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NXT_OUTPUT_DIR=$(Join-Path $env:RUNNER_TEMP 'nexo-ti-installer')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item $env:NXT_OUTPUT_DIR -ItemType Directory -Force | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup não encontrado." }
          & $iscc "server-installer\NexoTI-Central-Servidor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador." }

          $installer = Join-Path $env:NXT_OUTPUT_DIR "NexoTI-Central-Servidor-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Instalador não foi criado." }
          (Get-FileHash $installer -Algorithm SHA256).Hash | Out-File "$installer.sha256" -Encoding ascii

      - name: Instalar painel antigo para testar migracao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXO_INSTALL_NONINTERACTIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.0.6-painel-estoque --pattern NexoTI-Painel-Estoque-Setup.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar painel antigo para o teste.' }
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'NexoTI-Painel-Estoque-Setup.exe'
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $oldInstaller
          $info.Arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          $info.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($info)
          if (-not $process.WaitForExit(600000)) { throw 'Instalacao antiga excedeu 10 minutos.' }
          if ($process.ExitCode -ne 0) { throw "Instalacao antiga falhou: $($process.ExitCode)" }
          Get-ScheduledTask -TaskName 'NexoTI-PainelEstoque' -ErrorAction Stop | Out-Null

      - name: Instalar e validar a Central no Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:NXT_OUTPUT_DIR "NexoTI-Central-Servidor-Setup.exe"
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $installer
          $info.Arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          $info.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($info)
          if (-not $process.WaitForExit(240000)) { throw "Instalador nao encerrou em 4 minutos." }
          $service = Get-Service NexoTICentral -ErrorAction Stop
          if ($service.Status -ne "Running") { throw "Servico NexoTICentral nao iniciou: $($service.Status)" }
          if ($service.StartType -ne "Automatic") { throw "Servico nao esta configurado para iniciar automaticamente." }
          Get-ScheduledTask -TaskName "NexoTI-Central-Bandeja" -ErrorAction Stop | Out-Null
          if (Get-ScheduledTask -TaskName 'NexoTI-PainelEstoque' -ErrorAction SilentlyContinue) { throw 'Tarefa do painel antigo ainda ativa.' }
          if (Test-Path "${env:ProgramFiles(x86)}\Nexo TI\Painel de Estoque\unins000.exe") { throw 'Painel antigo continua instalado.' }
          $app = Join-Path $env:ProgramFiles "Nexo TI\Central de Operacoes\app"
          if (-not (Test-Path (Join-Path $app "public\toner.html"))) { throw "Interface de toner ausente." }
          if (-not (Test-Path (Join-Path $app "node_modules\type-is\node_modules\content-type\dist\index.js"))) { throw "Dependencia aninhada ausente." }
          $ok = $false
          for ($i=0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:3000/login.html" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw "Central nao respondeu na porta 3000." }
          Write-Host "Central completa, servico automatico e pagina de login validados."
      - name: Guardar diagnostico de instalacao em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-server-install-logs
          path: C:\ProgramData\NexoTI\CentralOperacoes\logs\*
      - name: Publicar instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.3.3-server"
          $installer = Join-Path $env:NXT_OUTPUT_DIR "NexoTI-Central-Servidor-Setup.exe"
          $checksum = "$installer.sha256"

          & gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $tag --target "${{ github.sha }}" --title "Nexo TI - Servidor interno v1.3.3" --notes "Central completa: serviço automático validado no Windows, dependências completas, acesso multiusuário e ícone de bandeja ao entrar na sessão. Remove painel antigo e preserva os dados."
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release." }
          }

          & gh release upload $tag $installer $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o instalador." }
