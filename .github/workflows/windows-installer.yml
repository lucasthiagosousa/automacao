name: Gerar instalador Windows
on:
  workflow_dispatch:
  push:
    branches: [main, ferias-acessos-local]
    paths: ["NXT-Automacao/**", ".github/workflows/windows-installer.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NXT-Automacao
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: NXT-Automacao/package-lock.json
      - name: Instalar dependências do sistema
        run: npm ci
      - name: Instalar empacotador desktop
        run: npm install --no-save --package-lock=false electron@39.2.7 electron-builder@26.0.12
      - name: Criar ícone do Windows
        shell: powershell
        run: magick build/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Validar banco, permissões e controles de segurança
        shell: powershell
        run: npm test
      - name: Validar sintaxe e vídeo do login
        shell: powershell
        run: |
          node --check server.js
          node --check desktop.js
          if (-not (Test-Path "public\\assets\\login-background.mp4")) {
            throw "Video do login nao encontrado."
          }

      - name: Gerar Setup.exe
        run: npx electron-builder --config electron-builder.yml --win nsis
      - name: Validar dependências empacotadas
        shell: powershell
        run: |
          $resources = "dist\win-unpacked\resources"
          $arquivos = @(
            "$resources\app.asar",
            "$resources\app.asar.unpacked\automacao.js"
          )
          foreach ($arquivo in $arquivos) {
            if (-not (Test-Path $arquivo)) { throw "Arquivo obrigatorio ausente: $arquivo" }
          }
          $executavel = Get-ChildItem -Path "dist\win-unpacked" -Filter "*.exe" | Select-Object -First 1
          if (-not $executavel) { throw "Executavel principal ausente." }

      - name: Publicar instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.0-server"
          $arquivo = Get-ChildItem -Path "dist" -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $arquivo) { throw "Instalador nao encontrado." }

          & gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $tag --target "${{ github.sha }}" --title "Central de Operacoes de TI - Servidor v1.2.0" --notes "Instalador Windows v1.2.0 com operacao de toners, QR Code, reservas, historico, diagnostico SNMP, previsao de compras, acesso multiusuario e banco centralizado."
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a release." }
          }

          & gh release upload $tag "$($arquivo.FullName)" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o instalador." }
